<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width,initial-scale=1.0" name="viewport" />
  <title>Assigned Jobs | AutoCare Pro</title>
  <link href="../css/style.css" rel="stylesheet" />
  <link href="../css/dashboard.css" rel="stylesheet" />
  <link href="../css/responsive.css" rel="stylesheet" />
  <link href="../css/customer-mechanic.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
    rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
</head>

<body>
  <header class="navbar">
    <a class="logo" href="../index.html">
      <i class="fa-solid fa-car-side"></i>AutoCare<span>Pro</span>
    </a>
    <button class="menu-toggle" id="menuToggle">
      ☰
    </button>
    <nav class="nav-links" id="navLinks">
      <a href="dashboard.html">Dashboard</a>
      <a href="assigned-jobs.html">Assigned Jobs</a>
    </nav><a class="login-btn" href="../index.html" onclick="logout();">Logout</a>
  </header>
  <main class="dashboard-page">
    <div class="dashboard-container">
      <div class="dashboard-header">
        <div>
          <h1>Assigned Jobs</h1>
          <p>View jobs assigned to you.</p>
        </div>
      </div>
      <div class="search-cont">
        <form id="jobSearchForm">
          <input type="text" id="jobSearchInput" maxlength="50"
            placeholder="Search by booking ID, vehicle, service or status">
          <button type="submit">Search</button>
        </form>
      </div>
      <div class="panel table-wrap">
        <table class="data-table">
          <tr>
            <th>Booking ID</th>
            <th>Vehicle</th>
            <th>Vehicle No.</th>
            <th>Service</th>
            <th>Time</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
          <tbody id="jobContainer">
            <tr>
              <td colspan="6">Loading jobs...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="../js/main.js"></script>
  <script src="../js/mechanic.js"></script>
</body>

</html>
