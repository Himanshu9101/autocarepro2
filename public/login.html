<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width,initial-scale=1.0" name="viewport" />
  <title>Login | AutoCare Pro</title>
  <link href="css/style.css" rel="stylesheet" />
  <link href="css/auth.css" rel="stylesheet" />
  <link href="css/responsive.css" rel="stylesheet" />
  <link href="css/mobile-tablet-pubile-resp.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
</head>

<body>
  <header class="navbar">
    <a class="logo" href="index.html"><i class="fa-solid fa-car-side"></i>AutoCare
      <span>Pro</span>
    </a>
    <a class="nav-links" href="index.html">← Back to Home
    </a>
  </header>
  <main class="auth-wrapper">
    <section class="auth-card">
      <div class="auth-header">
        <div class="icon"><i class="fa-solid fa-right-to-bracket"></i></div>
        <h1>Welcome Back!</h1>
        <p>Login to your AutoCare Pro account</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope input-icon"></i>
            <input id="email" placeholder="Enter your email address" required="" type="email" />
          </div>
        </div>
        <div class="form-group">
          <div class="password-row">
            <label>Password</label>
          </div>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input id="password" placeholder="Enter your password" minlength="8" required="" type="password" />
          </div>
        </div>
        <button class="submit-btn">Login</button>
      </form>
      <p class="bottom-text">Don't have an account? <a href="register.html">Register</a></p>
    </section>
  </main>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>

</html>
