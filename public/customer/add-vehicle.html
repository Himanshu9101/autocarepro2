<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width,initial-scale=1.0" name="viewport" />
  <title>Add Vehicle | AutoCare Pro</title>
  <link href="../css/style.css" rel="stylesheet" />
  <link href="../css/dashboard.css" rel="stylesheet" />
  <link href="../css/responsive.css" rel="stylesheet" />
  <link href="../css/customer-mechanic.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap"
    rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
</head>

<body>
  <header class="navbar">
    <a class="logo" href="../index.html">
      <i class="fa-solid fa-car-side"></i>AutoCare <span>Pro</span>
    </a>
    <button class="menu-toggle" id="menuToggle">
      ☰
    </button>
    <nav class="nav-links" id="navLinks">
      <a href="dashboard.html">Dashboard</a>
      <a href="vehicles.html">My Vehicles</a>
      <a href="book-service.html">Book Service</a>
      <a href="bookings.html">My Bookings</a>
      <a href="profile.html">Profile</a>
    </nav>
    <a class="login-btn" href="../index.html" onclick="logout();">Logout</a>
  </header>
  <main class="dashboard-page">
    <div class="dashboard-container">
      <div class="dashboard-header">
        <div>
          <h1>Add Vehicle</h1>
          <p>Enter the basic vehicle details.</p>
        </div>
      </div>
      <div class="panel form-card">
        <form id="vehicleForm">
          <div class="form-row">
            <div class="form-group">
              <label>Vehicle Brand</label><input id="brand" placeholder="e.g. Tata" type="text" />
            </div>
            <div class="form-group">
              <label>Registration Number</label>
              <input id="registration" type="text" maxlength="10" pattern="[A-Za-z]{2}[0-9]{2}[A-Za-z]{1,3}[0-9]{4}"
                oninput="this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10)"
                placeholder="MH12AB1234" required>
            </div>
            <div class="form-group">
              <label>Vehicle Model</label><input id="model" placeholder="Tata Nexon" type="text" />
            </div>
            <div class="form-group">
              <label>Vehicle Image <span>(Optional)</span></label>
              <input id="vehicleImage" type="file" accept="image/jpeg,image/png,image/webp" />
              <small class="filesmall">JPG, PNG or WEBP. Maximum 5 MB.</small>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Year</label>
              <input id="year" type="number" min="1900" max="2026" step="1" required>
            </div>
            <div class="form-group"><label>Fuel Type</label><select id="fuel">
                <option>Petrol</option>
                <option>Diesel</option>
                <option>CNG</option>
                <option>Electric</option>
              </select></div>
          </div><button class="dashboard-btn" type="submit">Save Vehicle</button>
        </form>
      </div>
    </div>
  </main>
  <script src="../js/main.js"></script>
  <script src="../js/customer.js"></script>
</body>

</html>
